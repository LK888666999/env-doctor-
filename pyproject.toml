[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "env-doctor"
version = "0.1.0"
description = "A lightweight CLI utility to validate, compare, and generate .env files."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["dotenv", "env", "cli", "validation", "config", "devops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.scripts]
env-doctor = "env_doctor:main"
